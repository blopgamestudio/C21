<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrés Election Clicker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
    color: #161616;
    background:
        linear-gradient(rgba(255,255,255,0.85), rgba(255,255,255,0.85)),
        repeating-linear-gradient(
            45deg,
            #0b3d91 0 20px,
            #ffffff 20px 40px,
            #d72638 40px 60px
        );
    display: grid;
    place-items: center;
    padding: 20px;
}

.vote-room {
    width: min(100%, 900px);
    background: #f8f5ea;
    border: 6px solid #1b1b1b;
    border-radius: 28px;
    box-shadow: 12px 12px 0 #1b1b1b;
    overflow: hidden;
}

.header {
    background: linear-gradient(135deg, #0b3d91, #102a60);
    color: white;
    padding: 24px;
    text-align: center;
    border-bottom: 6px solid #1b1b1b;
}

.header h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 4rem);
    text-transform: uppercase;
    letter-spacing: 2px;
}

.header p {
    margin: 10px 0 0;
    font-weight: 700;
    color: #ffe66d;
}

.main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    padding: 24px;
}

.panel {
    background: white;
    border: 4px solid #1b1b1b;
    border-radius: 22px;
    padding: 20px;
    box-shadow: 6px 6px 0 #1b1b1b;
}

.stats {
    display: grid;
    gap: 14px;
}

.stat {
    background: #f1f1f1;
    border: 3px solid #1b1b1b;
    border-radius: 16px;
    padding: 14px;
}

.stat span {
    display: block;
    font-size: 2.4rem;
    font-weight: 900;
    color: #d72638;
}

.machine-wrap {
    display: grid;
    place-items: center;
    gap: 18px;
}

.machine {
    width: min(260px, 70vw);
    aspect-ratio: 0.8;
    background: linear-gradient(145deg, #d9d9d9, #9c9c9c);
    border: 6px solid #1b1b1b;
    border-radius: 24px;
    box-shadow:
        8px 8px 0 #1b1b1b,
        inset 0 0 20px rgba(255,255,255,0.7);
    padding: 18px;
    cursor: pointer;
    transition: 0.12s;
    position: relative;
}

.machine:hover {
    transform: translateY(-4px) rotate(-1deg);
}

.machine:active {
    transform: translateY(6px) scale(0.98);
    box-shadow: 2px 2px 0 #1b1b1b;
}

.screen {
    height: 32%;
    background: #101820;
    color: #00ff88;
    border: 4px solid #1b1b1b;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-weight: 900;
    text-align: center;
    padding: 8px;
    box-shadow: inset 0 0 14px #00ff88;
}

.big-button {
    width: 90px;
    height: 90px;
    margin: 28px auto 0;
    border-radius: 50%;
    background: radial-gradient(circle, #ff4757, #9b111e);
    border: 5px solid #1b1b1b;
    box-shadow: 0 8px 0 #1b1b1b;
}

.slot {
    margin: 22px auto 0;
    width: 70%;
    height: 18px;
    background: #111;
    border-radius: 999px;
}

.vote-paper {
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    border: 3px solid #111;
    width: 120px;
    padding: 8px;
    font-size: 0.75rem;
    font-weight: 900;
    text-align: center;
}

.lots {
    max-height: 310px;
    overflow: auto;
}

.lot {
    background: #fff4c2;
    border: 3px dashed #1b1b1b;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
    font-weight: 800;
}

.message {
    margin-top: 18px;
    padding: 16px;
    background: #102a60;
    color: white;
    border: 4px solid #1b1b1b;
    border-radius: 18px;
    font-weight: 800;
}

.reset {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border-radius: 999px;
    border: 4px solid #1b1b1b;
    background: #ffe66d;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 0 #1b1b1b;
}

.reset:active {
    transform: translateY(5px);
    box-shadow: none;
}

@media (max-width: 720px) {
    .main {
        grid-template-columns: 1fr;
    }

    .vote-room {
        box-shadow: 6px 6px 0 #1b1b1b;
    }
}
</style>
</head>

<body>

<div class="vote-room">
    <header class="header">
        <h1>Votez Andrés</h1>
        <p>La démocratie la plus claquée mais la plus stylée du quartier.</p>
    </header>

    <main class="main">
        <section class="panel machine-wrap">
            <h2>VOTEZ POUR MOI</h2>

            <div class="machine" onclick="vote()">
                <div class="screen" id="screen">ANDRÉS<br>2026</div>
                <div class="big-button"></div>
                <div class="slot"></div>
                <div class="vote-paper">Bulletin Andrés </div>
            </div>

            <p class="message" id="message">Clique sur la machine pour voter Andrés.</p>
        </section>

        <section class="panel">
            <h2>📊 Résultats du bureau</h2>

            <div class="stats">
                <div class="stat">
                    Votes pour Andrés
                    <span id="votes">0</span>
                </div>

                <div class="stat">
                    Niveau électoral
                    <span id="level">1</span>
                </div>
            </div>

            <button class="reset" onclick="resetGame()">Recommencer l’élection</button>

            <h2>🎁 Lots débloqués</h2>
            <div class="lots" id="lots">
                <div class="lot">Aucun lot. Andrés attend le peuple.</div>
            </div>
        </section>
    </main>
</div>

<script>
let votes = 0;
let level = 1;
let unlocked = [];

const votesText = document.getElementById("votes");
const levelText = document.getElementById("level");
const message = document.getElementById("message");
const lots = document.getElementById("lots");
const screen = document.getElementById("screen");

const rewards = [
    { votes: 10, text: "🥐 Lot débloqué : croissant démocratique" },
    { votes: 25, text: "🧦 Lot débloqué : chaussettes présidentielles" },
    { votes: 50, text: "🏆 Lot débloqué : mini trophée en plastique" },
    { votes: 75, text: "🚲 Lot débloqué : vélo de campagne presque fiable" },
    { votes: 100, text: "👑 Lot débloqué : couronne municipale d’Andrés" },
    { votes: 150, text: "🛸 Lot débloqué : débat télévisé avec un alien" },
    { votes: 200, text: "🏛️ Lot débloqué : mairie gonflable officielle" }
];

const phrases = [
    "Un citoyen confus vote Andrés.",
    "Le président du bureau hoche la tête avec respect.",
    "La machine fait bip-boup très légalement.",
    "Un bulletin tombe. Personne ne sait d’où.",
    "Andrés gagne +1 en charisme institutionnel.",
    "La démocratie transpire, mais elle avance.",
    "Un assesseur crie : ‘C’est validé chef !’"
];

function vote() {
    votes++;
    level = Math.floor(votes / 50) + 1;

    votesText.innerText = votes;
    levelText.innerText = level;

    screen.innerHTML = `+1 VOTE<br>ANDRÉS`;

    message.innerText = phrases[Math.floor(Math.random() * phrases.length)];

    checkRewards();

    setTimeout(() => {
        screen.innerHTML = `ANDRÉS<br>2026`;
    }, 250);
}

function checkRewards() {
    rewards.forEach(reward => {
        if (votes >= reward.votes && !unlocked.includes(reward.votes)) {
            unlocked.push(reward.votes);
            message.innerText = reward.text + " !";

            if (unlocked.length === 1) {
                lots.innerHTML = "";
            }

            const div = document.createElement("div");
            div.className = "lot";
            div.innerText = reward.text + ` — ${reward.votes} votes`;
            lots.prepend(div);
        }
    });
}

function resetGame() {
    votes = 0;
    level = 1;
    unlocked = [];

    votesText.innerText = votes;
    levelText.innerText = level;
    screen.innerHTML = "ANDRÉS<br>2026";
    message.innerText = "Nouvelle élection. Même Andrés. Même chaos.";

    lots.innerHTML = '<div class="lot">Aucun lot. Andrés attend le peuple.</div>';
}
</script>

</body>
</html>
