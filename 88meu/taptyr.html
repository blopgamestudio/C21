<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAPE TYR</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}

body{
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
cursor:crosshair;
background:radial-gradient(circle at center,rgba(0,255,255,.12),transparent 35%),linear-gradient(135deg,#02070c,#07131d 45%,#000);
color:#dffcff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.game{
width:100%;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:20px;
padding:20px;
}

h1{
font-size:clamp(2rem,5vw,4rem);
letter-spacing:6px;
color:#7df9ff;
text-shadow:0 0 12px #00f7ff,0 0 35px #0077ff;
}

.hud{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}

.panel{
padding:12px 24px;
border:1px solid rgba(125,249,255,.7);
background:rgba(2,14,22,.75);
border-radius:10px;
box-shadow:0 0 18px rgba(0,255,255,.25),inset 0 0 18px rgba(0,120,255,.15);
font-weight:bold;
letter-spacing:2px;
}

.arena{
position:relative;
width:min(92vw,950px);
height:min(62vh,560px);
border:2px solid rgba(125,249,255,.7);
border-radius:18px;
overflow:hidden;
cursor:crosshair;
background:linear-gradient(90deg,rgba(125,249,255,.07) 1px,transparent 1px),linear-gradient(rgba(125,249,255,.07) 1px,transparent 1px),radial-gradient(circle at 50% 20%,rgba(0,120,255,.16),transparent 40%),#07111b;
background-size:42px 42px,42px 42px,100% 100%,100% 100%;
box-shadow:0 0 35px rgba(0,255,255,.22),inset 0 0 60px rgba(0,0,0,.8);
}

.arena::before{
content:"UNSC TRAINING ROOM // TARGET : TYR";
position:absolute;
top:15px;
left:18px;
font-size:12px;
letter-spacing:2px;
color:rgba(125,249,255,.6);
}

.hole{
position:absolute;
width:120px;
height:82px;
border-radius:50%;
background:radial-gradient(circle,#000 30%,#032b36 70%,#0ff 120%);
box-shadow:inset 0 0 25px #000,0 0 18px rgba(0,255,255,.35);
}

.tyr{
position:absolute;
width:110px;
height:110px;
left:5px;
bottom:18px;
border-radius:50% 50% 42% 42%;
display:none;
animation:pop .16s ease-out;
background:radial-gradient(circle at 35% 30%,#fff,transparent 8%),linear-gradient(145deg,#d8b083,#8e5536);
border:3px solid #3a1f13;
box-shadow:0 0 18px rgba(255,120,60,.7);
cursor:crosshair;
z-index:5;
}

.tyr::before{
content:"TYR";
position:absolute;
top:-24px;
left:50%;
transform:translateX(-50%);
font-size:13px;
font-weight:bold;
color:#ffd77a;
text-shadow:0 0 8px orange;
}

.tyr::after{
content:"ಠ_ಠ";
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
}

@keyframes pop{
from{transform:translateY(60px) scale(.6);opacity:0}
to{transform:translateY(0) scale(1);opacity:1}
}

.flash{
position:absolute;
pointer-events:none;
font-weight:bold;
font-size:28px;
animation:float .5s forwards;
z-index:9999;
}

.good{color:#7dff9b;text-shadow:0 0 12px #00ff66}
.bad{color:#ff4b4b;text-shadow:0 0 12px red}

@keyframes float{
from{opacity:1;transform:translateY(0) scale(1)}
to{opacity:0;transform:translateY(-40px) scale(1.3)}
}

button{
padding:14px 34px;
font-size:18px;
font-weight:bold;
letter-spacing:2px;
border-radius:10px;
cursor:pointer;
color:#dffcff;
background:linear-gradient(135deg,#062c3d,#01080d);
border:1px solid #7df9ff;
box-shadow:0 0 18px rgba(0,255,255,.25);
transition:.2s;
}

button:hover{
transform:scale(1.05);
background:linear-gradient(135deg,#0a5b78,#02121d);
}

.end{
position:absolute;
inset:0;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
gap:20px;
background:rgba(0,0,0,.85);
z-index:10;
text-align:center;
}

.end h2{
font-size:clamp(2rem,6vw,4.5rem);
color:#ff5252;
text-shadow:0 0 18px red;
}

.end p{
font-size:24px;
color:#7df9ff;
}

@media(max-width:700px){
.arena{height:65vh}
.hole{width:92px;height:64px}
.tyr{width:86px;height:86px;left:3px}
}
</style>
</head>

<body>

<div class="game">
<h1>TAPE TYR</h1>

<div class="hud">
<div class="panel">SCORE : <span id="score">0</span></div>
<div class="panel">TEMPS : <span id="time">30</span>s</div>
<div class="panel">STATUS : <span id="status">READY</span></div>
</div>

<div class="arena" id="arena">
<div class="end" id="end">
<h2>MISSION TERMINÉE</h2>
<p id="final"></p>
<button id="restartBtn">RESTART</button>
</div>
</div>

<button id="startBtn">LANCER L'ENTRAÎNEMENT</button>
</div>

<script>
const arena=document.getElementById("arena");
const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const statusEl=document.getElementById("status");
const end=document.getElementById("end");
const final=document.getElementById("final");
const startBtn=document.getElementById("startBtn");
const restartBtn=document.getElementById("restartBtn");

let score=0;
let time=30;
let active=false;
let currentTyr=null;
let timer=null;
let spawnTimer=null;

const spots=[
[12,68],[38,72],[66,66],
[20,44],[48,47],[73,42],
[10,22],[39,24],[68,19]
];

function buildArena(){
arena.querySelectorAll(".hole").forEach(h=>h.remove());

spots.forEach(pos=>{
const hole=document.createElement("div");
hole.className="hole";
hole.style.left=pos[0]+"%";
hole.style.top=pos[1]+"%";

const tyr=document.createElement("div");
tyr.className="tyr";

tyr.addEventListener("click",e=>{
e.stopPropagation();

if(!active)return;

hitTyr(e.clientX,e.clientY);
});

hole.appendChild(tyr);
arena.appendChild(hole);
});
}

function startGame(){
clearInterval(timer);
clearTimeout(spawnTimer);

score=0;
time=30;
active=true;
currentTyr=null;

scoreEl.textContent=score;
timeEl.textContent=time;
statusEl.textContent="COMBAT SIMULATION";
end.style.display="none";

buildArena();
spawnTyr();

timer=setInterval(()=>{
time--;
timeEl.textContent=time;

if(time<=0){
finishGame(false);
}
},1000);
}

function spawnTyr(){
if(!active)return;

hideTyr();

const tyrs=document.querySelectorAll(".tyr");
currentTyr=tyrs[Math.floor(Math.random()*tyrs.length)];
currentTyr.style.display="block";

spawnTimer=setTimeout(spawnTyr,Math.max(350,900-score*12));
}

function hideTyr(){
if(currentTyr){
currentTyr.style.display="none";
}
}

function hitTyr(x,y){
score++;
scoreEl.textContent=score;
statusEl.textContent="HIT CONFIRMÉ";
showText(x,y,"+1",true);

hideTyr();
clearTimeout(spawnTimer);
spawnTimer=setTimeout(spawnTyr,220);
}

function miss(x,y){
showText(x,y,"MISS",false);
finishGame(true);
}

function finishGame(loose){
active=false;

clearInterval(timer);
clearTimeout(spawnTimer);

hideTyr();

statusEl.textContent=loose?"ÉCHEC":"TERMINÉ";
end.style.display="flex";

final.textContent=loose
?"Tu as frappé dans le vide. Score : "+score
:"Simulation terminée. Score : "+score;
}

function showText(x,y,text,good){
const fx=document.createElement("div");
fx.className="flash "+(good?"good":"bad");
fx.textContent=text;

const rect=arena.getBoundingClientRect();

fx.style.left=(x-rect.left)+"px";
fx.style.top=(y-rect.top)+"px";

arena.appendChild(fx);

setTimeout(()=>{
fx.remove();
},500);
}

arena.addEventListener("click",e=>{
if(!active)return;
if(e.target.closest(".end"))return;
if(e.target.closest("button"))return;

miss(e.clientX,e.clientY);
});

startBtn.addEventListener("click",e=>{
e.stopPropagation();
startGame();
});

restartBtn.addEventListener("click",e=>{
e.stopPropagation();
startGame();
});

buildArena();
</script>

</body>
</html>
