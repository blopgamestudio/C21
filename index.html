<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C21 Base</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: black;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    position: relative;
    width: 1100px;
    height: 650px;
}

.block {
    position: absolute;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    cursor: pointer;
    transition: filter 0.3s ease, transform 0.3s ease;
}

.block img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}


.left {
    clip-path: polygon(0 0, 66% 0, 40% 100%, 0 100%);
    z-index: 2;
}


.right {
    clip-path: polygon(66% 0, 100% 0, 100% 100%, 30% 100%);
    z-index: 1;
}

.block:hover {
    filter: brightness(2);
}

.block:hover::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 40px rgb(254, 0, 8);
    pointer-events: none;
}
</style>
</head>
<body>

<div class="container">
    <a href="88meu/assets/index88.html" class="block left">
        <img src="AddPic/pic88.png" alt="C21 88">
    </a>

    <a href="Terrium/indexterr.html" class="block right">
        <img src="AddPic/picterr.png" alt="Terrium">
    </a>
</div>

</body>
</html>
